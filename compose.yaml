name: pitchpulse
services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pitchpulse}
      POSTGRES_USER: ${DB_USERNAME:-pitchpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
volumes:
  postgres-data:
