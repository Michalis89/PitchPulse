name: Foundation build and tests
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DB_PORT: '5433'
      DB_URL: jdbc:postgresql://localhost:5433/pitchpulse
      COMPOSE_PROJECT_NAME: pitchpulse-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build backend, unit tests and PostgreSQL integration tests
        working-directory: server
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Lint, unit test and build frontend
        working-directory: client
        run: |
          npm run lint
          npm test
          npm run build
      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Create ephemeral local database credential
        shell: bash
        run: |
          python3 - <<'PY'
          import os, secrets
          password = secrets.token_urlsafe(32)
          print(f'::add-mask::{password}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DB_PASSWORD={password}\n')
          PY
      - name: Start Compose database and packaged API
        shell: bash
        run: |
          docker compose up --detach --wait
          java -jar server/target/pitchpulse-server-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/pitchpulse-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/pitchpulse-server.log"
          exit 1
      - name: Browser connectivity, responsive layout, keyboard and axe smoke tests
        working-directory: client
        run: npm run e2e
      - name: Stop CI database
        if: always()
        run: docker compose down
